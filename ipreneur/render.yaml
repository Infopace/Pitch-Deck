# Render blueprint — backend API.
#
# Docker runtime, not the native Python one: the crawler drives Playwright
# Chromium, which needs libnss3/libgbm1/libcups2 and friends. Those are
# installed by infrastructure/docker/backend/Dockerfile and are not present in
# Render's native Python environment.
#
# Deploy: Render dashboard → New → Blueprint → point at this repo.
#
# Secrets are deliberately `sync: false`. Render prompts for them once in the
# dashboard and stores them there; they are never written into this file or
# into git. Every one of them is checked at boot by the production guard in
# app/core/config.py — a missing or placeholder value fails the deploy with a
# list of problems rather than starting an insecure service.

services:
  - type: web
    name: ipreneur-api
    runtime: docker
    repo: https://github.com/Puneethgowda4653/Pitch-Deck
    branch: main
    dockerfilePath: ./ipreneur/infrastructure/docker/backend/Dockerfile
    dockerContext: ./ipreneur/backend

    # Not `free`: free services sleep after ~15 minutes idle, and deck
    # generation runs in a background thread that a sleep kills exactly like a
    # deploy does. `standard` rather than `starter` because Chromium plus
    # python-pptx plus a 32K-token response is tight in 512MB.
    plan: standard
    region: singapore          # nearest to the Supabase ap-northeast-1 database
    healthCheckPath: /health
    autoDeploy: true

    envVars:
      # ── Non-secret ─────────────────────────────────────────────────────────
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_NAME
        value: iPreneur
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: GEMINI_MODEL_RESEARCH
        value: gemini-2.5-flash
      - key: GEMINI_MAX_TOKENS
        value: "32768"
      - key: GEMINI_THINKING_BUDGET
        value: "2048"
      - key: PLAYWRIGHT_BROWSERS_PATH
        value: /home/appuser/.cache/ms-playwright

      # Must be the deployed frontend origin. The production guard rejects a
      # value still containing localhost, so this cannot be left as a default.
      - key: CORS_ORIGINS
        sync: false

      # ── Secrets — set these in the Render dashboard ────────────────────────
      # Generate the two keys with: openssl rand -hex 32
      - key: APP_SECRET_KEY
        sync: false
      - key: JWT_SECRET_KEY
        sync: false
      - key: DATABASE_URL          # Supabase pooler URL, includes the password
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_API_KEY_2
        sync: false

      # ── Optional ──────────────────────────────────────────────────────────
      # Unset disables Sentry entirely; the app logs a line and carries on.
      - key: SENTRY_DSN
        sync: false

# ── Celery worker ────────────────────────────────────────────────────────────
# Deliberately not defined yet. app/workers/tasks/analysis.py still runs the
# older four-agent pipeline, while the live path uses MasterDeckAgent — adding
# a worker now would start a process that either sits idle or, if wired,
# regresses generation. Once the pipeline is ported, this is the same image
# with a different start command:

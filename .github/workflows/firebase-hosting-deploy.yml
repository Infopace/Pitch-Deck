name: Deploy frontend to Firebase Hosting

# Mirrors the backend's existing Cloud Build auto-deploy: fires on every push
# to main, but only when the frontend actually changed.
#
# Authenticates via Workload Identity Federation, not a stored JSON key — the
# Infopace org's organization policy (iam.disableServiceAccountKeyCreation)
# blocks service-account keys outright, so this is the only option, and it's
# the better one anyway: GitHub exchanges a short-lived OIDC token for GCP
# access on each run, and no credential ever sits in a repo secret.
#
# Needs a one-time setup in Google Cloud Console (no values here are secret —
# they identify WHERE to authenticate, not a credential):
#   - a Workload Identity Pool + GitHub OIDC provider, scoped to this repo
#   - the github-actions-hosting service account granted
#     roles/firebaseHosting.admin and allowed to be impersonated by that
#     provider
# See the setup walkthrough given alongside this file.
on:
  push:
    branches: [main]
    paths:
      - "ipreneur/frontend/**"
      - ".github/workflows/firebase-hosting-deploy.yml"

permissions:
  contents: read
  id-token: write   # required for Workload Identity Federation

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ipreneur/frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ipreneur/frontend/package-lock.json

      - run: npm ci
      - run: npm run build

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          project_id: pitch-deck-e1d6c
          workload_identity_provider: projects/554290694181/locations/global/workloadIdentityPools/github-actions/providers/github
          service_account: github-actions-hosting@pitch-deck-e1d6c.iam.gserviceaccount.com

      - run: npx firebase-tools@latest deploy --only hosting --project pitch-deck-e1d6c --non-interactive

name: Deploy frontend to Firebase Hosting

# Mirrors the backend's Cloud Build trigger: fires on every push to main,
# but only when something under the frontend actually changed, so a
# backend-only commit doesn't burn a build here for nothing.
on:
  push:
    branches: [main]
    paths:
      - "ipreneur/frontend/**"
      - ".github/workflows/firebase-hosting-deploy.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ipreneur/frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ipreneur/frontend/package-lock.json

      - run: npm ci
      - run: npm run build

      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: "${{ secrets.GITHUB_TOKEN }}"
          firebaseServiceAccount: "${{ secrets.FIREBASE_SERVICE_ACCOUNT }}"
          projectId: pitch-deck-e1d6c
          channelId: live
          entryPoint: ipreneur/frontend
